{% extends "layout_game.html" %}

{% block SCRIPT %}
<script>
    var canvas;
    var context;
    var isDrawing = false;
    var previousX = 0;
    var previousY = 0;

    // Canvasを初期化
    window.addEventListener("load", function () {
        canvas = document.getElementById("drawCanvas");
        context = canvas.getContext("2d");

        // 背景を白にする
        context.fillStyle = "#FFFFFF";
        context.fillRect(0, 0, canvas.width, canvas.height);

        // 線の設定
        context.strokeStyle = "#000000";
        context.lineWidth = window.matchMedia("(pointer: coarse)").matches ? 15 : 20;
        context.lineJoin = "round";
        context.lineCap = "round";

        // マウス操作
        canvas.addEventListener("mousedown",  startDrawing);
        canvas.addEventListener("mousemove",  draw);
        canvas.addEventListener("mouseup",    stopDrawing);
        canvas.addEventListener("mouseleave", stopDrawing);

        // タッチ操作
        canvas.addEventListener("touchstart", startDrawing, { passive: false });
        canvas.addEventListener("touchmove",  draw,         { passive: false });
        canvas.addEventListener("touchend",   stopDrawing,  { passive: false });
    });

    // マウス・タッチの座標をCanvas上の座標に変換
    function getCanvasPosition(event) {
        var rect = canvas.getBoundingClientRect();
        var x;
        var y;

        if (event.touches) {
            x = event.touches[0].clientX;
            y = event.touches[0].clientY;
        } else {
            x = event.clientX;
            y = event.clientY;
        }

        return {
            x: x - rect.left,
            y: y - rect.top
        };
    }

    // 描画開始
    function startDrawing(event) {
        var position = getCanvasPosition(event);

        previousX = position.x;
        previousY = position.y;
        isDrawing = true;

        event.preventDefault();
    }

    // 線を描画
    function draw(event) {
        if (!isDrawing) {
            return;
        }

        var position = getCanvasPosition(event);

        context.beginPath();
        context.moveTo(previousX, previousY);
        context.lineTo(position.x, position.y);
        context.stroke();

        previousX = position.x;
        previousY = position.y;

        event.preventDefault();
    }

    // 描画終了
    function stopDrawing(event) {
        isDrawing = false;
        event.preventDefault();
    }

    // Canvasを消去
    function clearCanvas() {
        context.fillStyle = "#FFFFFF";
        context.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Canvasの内容をPNGにしてFlaskへ送信
    function sendImage() {
        canvas.toBlob(function (blob) {
            var formData = new FormData();
            formData.append("draw_num", blob, "recog_num.png");

            fetch("{{url_for('game.recog_num_png')}}", {
                method: "POST",
                body: formData
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    // 元画像と前処理画像
                    document.getElementById("sendImg").src = "data:image/png;base64," + data.image;

                    // 認識結果
                    displayResult("resultNN",  data.result_nn);
                    displayResult("resultSVM", data.result_svm);
                    displayResult("resultKNN", data.result_knn);

                    // キャンバス消去
                    clearCanvas();
                })
        }, "image/png");
    }

    // 認識結果を表示
    function displayResult(elementId, result) {
        var container = document.getElementById(elementId);
        container.replaceChildren();

        // 1位の数字と推定確率
        var topResult = document.createElement("div");
        topResult.className = "card-body text-success";

        var topNumber = document.createElement("div");
        topNumber.className = "display-1 fw-bold";
        topNumber.textContent = result[0][0];

        var topProbability = document.createElement("h3");
        topProbability.textContent = (result[0][1] * 100).toFixed(2) + "%";

        topResult.append(topNumber, topProbability);
        container.appendChild(topResult);

        // 2位以下のランキング
        var list = document.createElement("div");
        list.className = "list-group list-group-flush";

        result.slice(1, 4).forEach(function (item) {
            var row = document.createElement("div");
            row.className = "list-group-item d-flex justify-content-between";

            var number = document.createElement("span");
            number.textContent = item[0];

            var probability = document.createElement("span");
            probability.textContent = (item[1] * 100).toFixed(2) + "%";

            row.append(number, probability);
            list.appendChild(row);
        });
        container.appendChild(list);
    }
</script>
{% endblock %}

{% block BODY %}
<h2><a href="{{url_for('game.recog_num_view')}}" class="heading">数字認識</a></h2>
<p>画面上に数字を描き、「認識」ボタンを押してください。機械学習モデルが数字を判定します。</p>
<br>

<div class="row g-2">
    <div class="col-12 col-md-3">
        <div class="card text-center border-success h-100">
            <div class="card-header text-center">
                <h4 class="mb-0">step1 入力</h4>
            </div>
            <div class="card-body p-2">
                <canvas id="drawCanvas" width="300" height="300" style="width:300px; height:300px; border:1px solid #000; touch-action:none;"></canvas>
                <br>

                <button class="btn btn-primary"        style="width: 300px;" onclick="sendImage()">認識</button>
                <button class="btn btn-outline-danger" style="width: 300px;" onclick="clearCanvas()">消去</button>
            </div>
        </div>
    </div>

    <div class="col-12 col-md-3">
        <div class="card text-center border-success h-100">
            <div class="card-header text-center">
                <h4 class="mb-0">step2 前処理画像</h4>
            </div>

            <div class="card-body d-flex align-items-center justify-content-center">
                <img id="sendImg" style="width:100%; height:auto;">
            </div>
        </div>
    </div>

    <div class="col-12 col-md-6">
        <div class="card border-success h-100">
            <div class="card-header text-center">
                <h4 class="mb-0">step3 認識結果</h4>
            </div>

            <div class="card-body p-0">
                <div class="card-group">
                    <div class="card text-center border-secondary">
                        <div class="card-header">
                            ニューラルネットワーク
                        </div>
                        <div id="resultNN"></div>
                    </div>

                    <div class="card text-center border-secondary">
                        <div class="card-header">
                            サポートベクターマシン
                        </div>
                        <div id="resultSVM"></div>
                    </div>

                    <div class="card text-center border-secondary">
                        <div class="card-header">
                            k近傍法
                        </div>
                        <div id="resultKNN"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
