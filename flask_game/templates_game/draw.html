{% extends "layout_game.html" %}

{% block SCRIPT %}
<script>
    var canvas;
    var ctx;
    var drawing = false;
    var lastX = 0;
    var lastY = 0;

    window.addEventListener("load", function () {
        canvas = document.getElementById("drawCanvas");
        ctx = canvas.getContext("2d");

        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 40;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";

        canvas.addEventListener("mousedown", startDraw);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseup", endDraw);
        canvas.addEventListener("mouseleave", endDraw);

        canvas.addEventListener("touchstart", startDraw, { passive: false });
        canvas.addEventListener("touchmove", draw, { passive: false });
        canvas.addEventListener("touchend", endDraw, { passive: false });
    });

    function getPosition(event) {
        var rect = canvas.getBoundingClientRect();

        if (event.touches) {
            return {
                x: event.touches[0].clientX - rect.left,
                y: event.touches[0].clientY - rect.top
            };
        }

        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };
    }

    function startDraw(event) {
        var pos = getPosition(event);

        lastX = pos.x;
        lastY = pos.y;
        drawing = true;

        event.preventDefault();
    }

    function draw(event) {
        if (!drawing) return;

        var pos = getPosition(event);

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();

        lastX = pos.x;
        lastY = pos.y;

        event.preventDefault();
    }

    function endDraw(event) {
        drawing = false;
        event.preventDefault();
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function strIMG() {
        canvas.toBlob(function (blob) {
            var formData = new FormData();
            formData.append("draw_num", blob, "draw.png");

            fetch("{{url_for('game.draw_png')}}", { method: "POST", body: formData });
        }, "image/png");
    }
</script>
{% endblock %}

{% block BODY %}
<div style="text-align:center;">
    <canvas id="drawCanvas" width="400" height="300" style="width:400px; height:300px; border:1px solid #000; touch-action:none;"></canvas>
    <br>

    <button class="btn btn-outline-primary" onclick="strIMG()">認識</button>
    <button class="btn btn-outline-danger" onclick="clearCanvas()">削除</button>
</div>
{% endblock %}
